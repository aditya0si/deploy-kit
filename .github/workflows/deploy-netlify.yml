name: Deploy (Netlify)
on:
  workflow_call:
    inputs:
      publish-dir:
        type: string
        default: "."
      build-command:
        type: string
        default: ""
      prod:
        type: boolean
        default: true
      verify-marker:
        type: string
        default: ""
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
      - name: Deploy
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          FLAGS=""
          if [ "${{ inputs.prod }}" = "true" ]; then FLAGS="--prod"; fi
          npx --yes netlify-cli@latest deploy $FLAGS --dir="${{ inputs.publish-dir }}" --json > out.json
          URL=$(python3 -c 'import json;print(json.load(open("out.json")).get("url",""))')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::deployed $URL"
      - name: Verify body content
        if: ${{ inputs.verify-marker != '' }}
        env:
          URL: ${{ steps.deploy.outputs.url }}
          MARKER: ${{ inputs.verify-marker }}
        run: |
          body=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$URL")
          if printf '%s' "$body" | grep -qF "$MARKER"; then echo "verified marker in $URL";
          else echo "::error::marker '$MARKER' not found in $URL"; exit 1; fi
