name: Deploy (Netlify)
on:
  workflow_call:
    inputs:
      publish-dir:
        type: string
        default: "."
      build-command:
        type: string
        default: ""
      prod:
        type: boolean
        default: true
      verify-marker:
        type: string
        default: ""
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-netlify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout deploy-kit input validator
        uses: actions/checkout@v4
        with:
          repository: aditya0si/deploy-kit
          # job.workflow_sha is this reusable workflow's own revision; github.workflow_sha
          # tracks the caller, so it would execute helper code at an untrusted revision.
          ref: ${{ job.workflow_sha }}
          path: .deploy-kit-tools
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
      - name: Validate publish directory
        env:
          PUBLISH_DIR: ${{ inputs.publish-dir }}
        run: python3 "${{ github.workspace }}/.deploy-kit-tools/scripts/validate_inputs.py" path "$PUBLISH_DIR"
      - name: Deploy
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PUBLISH_DIR: ${{ inputs.publish-dir }}
          PROD: ${{ inputs.prod }}
        run: |
          FLAGS=""
          if [ "$PROD" = "true" ]; then FLAGS="--prod"; fi
          npx --yes netlify-cli@27.10.0 deploy $FLAGS --dir="$PUBLISH_DIR" --json > out.json
          URL=$(python3 -c 'import json;print(json.load(open("out.json")).get("url",""))')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::deployed $URL"
      - name: Verify body content
        if: ${{ inputs.verify-marker != '' }}
        env:
          URL: ${{ steps.deploy.outputs.url }}
          MARKER: ${{ inputs.verify-marker }}
        run: |
          body=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$URL")
          if printf '%s' "$body" | grep -qF "$MARKER"; then echo "verified marker in $URL";
          else echo "::error::marker '$MARKER' not found in $URL"; exit 1; fi
